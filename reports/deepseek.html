<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvoCAD Geometry Review</title><p>DeepSeek 实验已并入统一浏览界面。<a id="destination" href="../geometry/?view=deepseek-r9-text&amp;model=deepseek-flash">打开实验</a></p><script>
const valid=['deepseek-r9-text','deepseek-r9-image','deepseek-r9-assembly'];
const p=new URLSearchParams(location.search); const requested=p.get('experiment')||location.hash.slice(1);
const view=valid.includes(requested)?requested:valid[0];

const sample=p.get('sample'); if(/^[TIA](0[1-9]|10)$/.test(sample||''))target.searchParams.set('sample',sample);

</script></html>
